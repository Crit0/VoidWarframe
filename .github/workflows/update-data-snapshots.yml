name: Update data snapshots
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
concurrency:
  group: update-data-snapshots
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch snapshots
        run: bash scripts/fetch-snapshots.sh
      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(data): refresh snapshots $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
