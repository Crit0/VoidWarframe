# Local development stack: PostgreSQL + the app.
# Usage:
#   docker compose up -d db      # just the database for `npm run dev`
#   docker compose up --build    # full stack in containers

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: voidwf
      POSTGRES_PASSWORD: voidwf
      POSTGRES_DB: voidwf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voidwf"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://voidwf:voidwf@db:5432/voidwf?schema=public
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
